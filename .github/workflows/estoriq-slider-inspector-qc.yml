name: Estoriq slider inspector QC
on:
  push:
    branches: [feature/estoriq-slider-inspector]
    paths-ignore:
      - estoriq-creative-lab/dist/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: estoriq-creative-lab
      - run: npm run build
        working-directory: estoriq-creative-lab
      - name: Commit QC build on feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f estoriq-creative-lab/dist/
          if ! git diff --cached --quiet; then
            git commit -m "chore: slider QC static build [skip ci]"
            git push origin HEAD:refs/heads/feature/estoriq-slider-inspector
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: estoriq-slider-inspector-qc
          path: estoriq-creative-lab/dist
